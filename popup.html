<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperSelect</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --black: #000;
      --white: #fff;
      --gray-100: #f5f5f5;
      --gray-200: #e5e5e5;
      --gray-400: #a3a3a3;
      --gray-600: #525252;
      --gray-800: #262626;
    }
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      background: var(--white);
      color: var(--black);
      font: 13px/1.45 "Satoshi", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      padding: 15px 16px 14px;
      background: var(--black);
      color: var(--white);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--white);
      background: var(--white);
      color: var(--black);
      font-size: 17px;
      font-weight: 800;
      line-height: 1;
    }
    h1 { margin: 0; font-size: 17px; line-height: 1.15; letter-spacing: -.45px; font-weight: 800; }
    .subtitle { margin: 3px 0 0; color: #d4d4d4; font-size: 11px; }
    main { padding: 15px 16px 14px; }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .9px;
      text-transform: uppercase;
    }
    .section-heading span:last-child {
      color: var(--gray-600);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
    }
    .field { margin-bottom: 10px; }
    label { display: block; margin: 0 0 4px; color: var(--black); font-size: 12px; font-weight: 700; }
    select, input {
      appearance: auto;
      display: block;
      width: 100%;
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid var(--gray-400);
      border-radius: 0;
      background: var(--white);
      color: var(--black);
      font: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    select:focus, input:focus { border-color: var(--black); box-shadow: 0 0 0 2px #d4d4d4; }
    input::placeholder { color: var(--gray-600); }
    .helper { margin: -1px 0 11px; color: var(--gray-600); font-size: 10px; }
    .error { display: none; margin: 0 0 9px; padding: 8px 9px; border: 1px solid var(--black); color: var(--black); background: var(--gray-100); font-size: 11px; }
    .error:not(:empty) { display: block; }
    .open-button {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 9px 12px;
      border: 1px solid var(--black);
      border-radius: 0;
      background: var(--black);
      color: var(--white);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .open-button:hover { background: var(--white); color: var(--black); }
    .open-button:focus-visible { outline: 2px solid var(--black); outline-offset: 2px; }
    .arrow { font-size: 15px; line-height: 1; }
    .footer { margin-top: 11px; padding-top: 9px; border-top: 1px solid var(--gray-200); color: var(--gray-600); font-size: 10px; text-align: center; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">P</div>
      <div><h1>PaperSelect</h1><p class="subtitle">Cambridge past papers, one click away</p></div>
    </div>
  </header>
  <main>
    <div class="section-heading"><span>Build your paper</span><span>CAIE · PDF finder</span></div>
    <div class="field">
      <label for="subject">Subject</label>
      <select id="subject">
        <option value="9709">Mathematics</option>
        <option value="9093">English Language</option>
        <option value="9702">Physics</option>
        <option value="9701">Chemistry</option>
        <option value="9626">Information Technology</option>
        <option value="9700">Biology</option>
        <option value="9706">Accounting</option>
        <option value="9609">Business</option>
        <option value="9708">Economics</option>
        <option value="9990">Psychology</option>
        <option value="9084">Law</option>
      </select>
    </div>
    <div class="field">
      <label for="year">Year</label>
      <select id="year"></select>
    </div>
    <div class="field">
      <label for="series">Series</label>
      <select id="series">
        <option value="m">March (m)</option>
        <option value="s">May / June (s)</option>
        <option value="w">Oct / Nov (w)</option>
      </select>
    </div>
    <div class="field">
      <label for="paper">Component (paper)</label>
      <input id="paper" type="number" min="1" max="9" placeholder="e.g. 4" inputmode="numeric">
    </div>
    <div class="field">
      <label for="variant">Variant</label>
      <select id="variant">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>
    <div class="field">
      <label for="ptype">Paper type</label>
      <select id="ptype">
        <option value="qp">Question paper (qp)</option>
        <option value="ms">Mark scheme (ms)</option>
        <option value="er">Examiner report (er)</option>
      </select>
    </div>
    <p class="helper">Pattern: code_series-year_type_paper+variant.pdf</p>
    <div id="error" class="error" role="alert" aria-live="polite"></div>
    <button id="open" class="open-button" type="button">Open PDF <span class="arrow" aria-hidden="true">↗</span></button>
    <div class="footer">Made for focused revision · Always check the syllabus code</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
